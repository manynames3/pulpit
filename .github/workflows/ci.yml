name: Pulpit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.7.0"
  AWS_REGION:  "us-east-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Validate (no AWS creds needed)
  # ─────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Test Dependencies
        run: python -m pip install -r lambda/query/requirements.txt

      - name: Build Lambda Packages
        run: ./scripts/build-lambda.sh

      - name: Python Syntax Check
        run: python -m py_compile lambda/query/query_service.py scripts/rebuild_index.py scripts/evaluate_retrieval.py scripts/test_korean_search.py

      - name: Retrieval Regression Tests
        run: python scripts/test_korean_search.py

      - name: Frontend JavaScript Syntax Check
        run: awk '/<script>/{flag=1; next} /<\/script>/{flag=0} flag' frontend-alternative/index.html | node --check

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

  # ─────────────────────────────────────────
  # JOB 2 — Plan (requires AWS creds)
  # Runs from root with dev tfvars
  # ─────────────────────────────────────────
  plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Build Lambda Packages
        run: ./scripts/build-lambda.sh

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false -var-file=environments/dev/terraform.tfvars > plan.txt 2>&1
          status=$?
          {
            echo "stdout<<EOF"
            sed -n '1,650p' plan.txt
            echo "EOF"
            echo "exitcode=$status"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `### 🗺️ Terraform Plan (dev)
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
